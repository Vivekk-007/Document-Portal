# .github/workflows/ci.yaml

name: Document Portal CI

on:
  push:
    branches:
      - master
      - main

  pull_request:
    branches:
      - master
      - main

jobs:
  test:
    name: Run Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Install Dependencies
        run: |
          uv sync --frozen --all-extras

      - name: Verify FastAPI App
        run: |
          uv run python -c "from api.main import app; print('FastAPI app imported successfully')"

      - name: Run Unit Tests
        run: |
          uv run pytest tests/ -v