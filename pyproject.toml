[project]
name = "document-portal"
version = "0.1.0"
description = "AI-powered document portal using LangChain RAG"
readme = "README.md"
requires-python = ">=3.11"

dependencies = [
    # LangChain
    "langchain==0.3.27",
    "langchain-core==0.3.75",
    "langchain-community==0.3.29",
    "langchain-text-splitters==0.3.9",
    # LLM Providers
    "langchain-google-genai==2.1.10",
    "langchain-groq==0.3.7",
    "langchain-huggingface==0.3.1",
    # Vector Store
    "faiss-cpu==1.11.0.post1",
    # Embeddings
    "sentence-transformers==5.1.0",
    "huggingface-hub==0.34.4",
    # PDF Processing
    "pymupdf==1.26.3",
    "pypdf==5.9.0",
    # Data
    "pandas==2.3.1",
    # Environment
    "python-dotenv==1.1.1",
    "pyyaml==6.0.2",
    # Logging
    "structlog==25.4.0",
    # Jupyter
    "ipython==9.4.0",
    "ipykernel==6.30.1",
    "langchain-core[tracing]",
    # Debugging
    "asttokens==3.0.0",
    "executing==2.2.0",
    "pure-eval==0.2.3",
    "streamlit>=1.60.0",
    "docx2txt>=0.9",
    "fastapi==0.116.1",
    "pytest==8.4.1",
    "pylint==3.3.7",
]
